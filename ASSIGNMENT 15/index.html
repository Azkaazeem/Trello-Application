<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trello board | Trello</title>
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/js/all.min.js"
        integrity="sha512-6BTOlkauINO65nLhXhthZMtepgJSghyimIalb+crKRPhvhmsCdnIuGcVbR5/aQY2A+260iC1OPy1oCdB6pSSwQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="images/0.png" type="image/x-icon">
</head>

<body>
    <nav>
        <div id="nav1">
            <div id="nav1-side1">
                <span id="dashboard"><img src="images/01.png" alt="" class="hover"></span>
                <span id="logo" class="hover"><img src="images/02.png" alt=""> Trello</span>
            </div>

            <div id="nav1-side2">
                <div id="search-bar" class="hover"><i class="fa-solid fa-magnifying-glass"
                        style="color: #ffffff;"></i><input type="text" placeholder="Search"></div>
                <button id="create-btn" class="hover">Create</button>
            </div>

            <div id="nav1-side3">
                <button id="pro-btn"><img src="images/03.png" alt=""> 2 days left</button>
                <div><i class="fa-solid fa-bullhorn" style="color: #ffffff;"></i></div>
                <div><i class="fa-regular fa-bell" style="color: #ffffff;"></i></div>
                <div><i class="fa-regular fa-circle-question" style="color: #ffffff;"></i></div>
                <div id="user">AA</div>
            </div>
        </div>

        <div id="nav2">
            <nav class="navbar navbar-expand-lg trello-header">
                <div class="container-fluid">
                    <!-- Left Side -->
                    <div class="d-flex align-items-center">
                        <h5 class="mb-0 fw-bold text-white me-2">My Trello board</h5>
                        <button class="btn btn-sm dropdown-toggle text-white border-0" type="button"></button>
                    </div>

                    <!-- Right Side Icons -->
                    <div class="d-flex align-items-center gap-3">
                        <div class="icon-circle text-white">AA</div>
                        <i class="fas fa-rocket text-white"></i>
                        <i class="fas fa-bolt text-white"></i>
                        <i class="fas fa-filter text-white"></i>
                        <i class="far fa-star text-white"></i>
                        <i class="fas fa-users text-white"></i>
                        <button class="btn btn-light btn-sm"><i class="fas fa-user-plus me-1"></i>Share</button>
                        <i class="fas fa-ellipsis-h text-white"></i>
                    </div>
                </div>
            </nav>
        </div>
    </nav>



    <div class="board" id="board">
    <div class="list">
      <div class="list-title">Today</div>
      <div class="card-input" draggable="true">
        <input type="text" value="Start using Trello" readonly>
      </div>
      <button class="btn btn-link text-dark p-0">+ Add a card</button>
    </div>

    <div class="list">
      <div class="list-title">This Week</div>
      <div class="card-input" draggable="true">
        <input type="text" value="Example Task" readonly>
      </div>
      <button class="btn btn-link text-dark p-0">+ Add a card</button>
    </div>

    <div class="add-list" id="addListBtn">+ Add another list</div>
  </div>

      <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
